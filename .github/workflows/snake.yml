name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *" # every day
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1b3168&color_dots=#eef4fb,#cfe2f3,#8fbbde,#3e7cb1,#1b3168
            dist/snake-dark.svg?palette=github-dark&color_snake=#8fbbde&color_dots=#161b22,#1f3a5f,#2f6aa3,#5a95c8,#8fbbde

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
